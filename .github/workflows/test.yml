name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    env:
      NODE_ENV: test
      MONGO_URI: ${{ secrets.MONGO_URI_TEST }}      # ← ЗАССАН
      JWT_SECRET: ${{ secrets.JWT_SECRET }}          # ← ЗАССАН
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}  # ← ЗАССАН
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Run backend tests
        run: npm run test --workspace=packages/backend
        # MONGO_URI нь env блокоос автоматаар дамжина

      - name: Run frontend tests
        run: npm run test --workspace=packages/frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/frontend

      - name: Run E2E tests
        run: npm run test:e2e --workspace=packages/frontend
        continue-on-error: true

      - name: Generate frontend coverage
        run: npm run test:coverage --workspace=packages/frontend
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
        continue-on-error: true