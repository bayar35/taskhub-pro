name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/test
      JWT_SECRET: ci-test-jwt-secret-with-minimum-32-characters-long
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-with-minimum-32-characters

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run backend tests
        run: npm run test --workspace=packages/backend

      - name: Run frontend tests
        run: npm run test --workspace=packages/frontend