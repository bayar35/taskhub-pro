name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/test
      JWT_SECRET: ci-test-jwt-secret-with-minimum-32-characters-long
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-with-minimum-32-characters

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-7.0.14
          restore-keys: |
            ${{ runner.os }}-mongodb-binaries-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Run backend tests
        run: npm run test --workspace=packages/backend

      - name: Run frontend tests
        run: npm run test --workspace=packages/frontend

              - name: Generate frontend coverage
        run: npm run test:coverage --workspace=packages/frontend
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false