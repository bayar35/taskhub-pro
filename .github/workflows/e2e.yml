name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    timeout-minutes: 30
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      MONGO_URI: ${{ secrets.MONGO_URI_TEST }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
      CLIENT_URL: http://localhost:5173
      PORT: 5000
      VITE_API_URL: http://localhost:5000
      E2E_BASE_URL: http://localhost:5173
      E2E_API_URL: http://localhost:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Build backend
        run: npm run build --workspace=packages/backend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/frontend

      # ======================================================================
      # BACKEND серверийг асаах
      # ======================================================================
      - name: Start backend server
        run: |
          npm run start --workspace=packages/backend > backend.log 2>&1 &
          echo "Backend PID: $!"
        env:
          NODE_ENV: test
          MONGO_URI: ${{ secrets.MONGO_URI_TEST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          CORS_ORIGIN: http://localhost:5173
          CLIENT_URL: http://localhost:5173
          PORT: 5000

      - name: Wait for backend
        run: npx wait-on http://localhost:5000/health --timeout 90000

      - name: Show backend logs (if failed)
        if: failure()
        run: cat backend.log

      # ======================================================================
      # FRONTEND серверийг асаах
      # ======================================================================
      - name: Start frontend server
        run: |
          npm run dev --workspace=packages/frontend > frontend.log 2>&1 &
          echo "Frontend PID: $!"
        env:
          VITE_API_URL: http://localhost:5000

      - name: Wait for frontend
        run: npx wait-on http://localhost:5173 --timeout 90000

      - name: Show frontend logs (if failed)
        if: failure()
        run: cat frontend.log

      # ======================================================================
      # E2E тестүүдийг ажиллуулах
      # ======================================================================
      - name: Run E2E tests
        run: npx playwright test --project=chromium --workers=1
        working-directory: packages/frontend
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:5000

      # ======================================================================
      # Лог болон report хадгалах
      # ======================================================================
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: packages/frontend/playwright-report/
          retention-days: 14

      - name: Upload backend logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-logs
          path: backend.log
          retention-days: 7

      - name: Upload frontend logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-logs
          path: frontend.log
          retention-days: 7