name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    timeout-minutes: 30
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build --workspace=packages/shared

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start backend
        run: |
          npm run build --workspace=packages/backend
          npm run start --workspace=packages/backend &
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/taskhub_e2e
          JWT_SECRET: test-secret-key-min-32-characters-long-xxx
          JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars-long-xx
          CORS_ORIGIN: http://localhost:5173
          CLIENT_URL: http://localhost:5173

      - name: Wait for backend
        run: npx wait-on http://localhost:5000/health --timeout 60000

      - name: Start frontend
        run: npm run dev --workspace=packages/frontend &
        env:
          VITE_API_URL: http://localhost:5000

      - name: Wait for frontend
        run: npx wait-on http://localhost:5173 --timeout 60000

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:5000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14