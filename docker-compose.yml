version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: taskhub-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: taskhub
    networks:
      - taskhub-network

  redis:
    image: redis:7-alpine
    container_name: taskhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - taskhub-network

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: taskhub-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/taskhub
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost
      CORS_ORIGIN: http://localhost
    depends_on:
      - mongodb
      - redis
    networks:
      - taskhub-network

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: taskhub-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - taskhub-network

volumes:
  mongodb_data:
  redis_data:

networks:
  taskhub-network:
    driver: bridge